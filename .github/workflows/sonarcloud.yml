name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # SonarCloud가 PR 정보를 읽기 위해 필요합니다.

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarCloud가 새로운 코드를 정확히 추적하려면 전체 git 히스토리가 필요합니다.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run SonarCloud Analysis
        run: ./gradlew build sonarqube
        env:
          # 분석 요청을 인증하기 위한 SonarCloud 토큰
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # PR에 분석 결과를 코멘트로 달기 위해 필요한 GitHub 토큰
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

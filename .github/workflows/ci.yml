name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  Analysis:
    name: Full CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud needs full history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.1

      - name: Install reviewdog for Lint
        uses: reviewdog/action-setup@v1

      - name: Run Build, Lint, Test and Sonar
        run: ./gradlew build lint jacocoTestReport sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Android Lint Results
        uses: ilyagulya/android-lint-action@v0.12.1
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_xml_file: shared/build/reports/lint-results-debug.xml
          reporter: github-pr-review
          level: warning

      - name: MobSF Security Scan
        uses: ./.github/actions/mobsf-scan
